<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>我的入党心声</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
      overflow-x: hidden;
    }

    html {
      background: #fff;
    }

    body {
      color: #ffffff;
    }

    .page-wrapper {
      width: 100%;
      max-width: 375px;
      margin: 0 auto;
      position: relative;
      min-height: 100vh;
      overflow-x: hidden;
      background: linear-gradient(160deg, #8B0000 0%, #C41E3A 30%, #D32F2F 60%, #B71C1C 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 24px 30px;
    }

    .badge {
      display: inline-block;
      border: 1.5px solid rgba(255, 215, 0, 0.65);
      border-radius: 30px;
      padding: 6px 22px;
      font-size: 13px;
      color: #FFD700;
      letter-spacing: 3px;
      backdrop-filter: blur(8px);
      background: rgba(0, 0, 0, 0.15);
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.4);
      margin-bottom: 14px;
    }

    /* ===== 步骤进度条 ===== */
    .step-bar {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 14px;
    }

    .step-dots {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0;
    }

    .step-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      border: 2px solid rgba(255, 215, 0, 0.35);
      background: transparent;
      transition: all 0.4s ease;
      flex-shrink: 0;
    }

    .step-dot.active {
      width: 14px;
      height: 14px;
      background: #FFD700;
      border-color: #FFD700;
      box-shadow: 0 0 12px rgba(255, 215, 0, 0.4);
    }

    .step-dot.done {
      background: rgba(255, 215, 0, 0.7);
      border-color: rgba(255, 215, 0, 0.7);
    }

    .step-line {
      width: 32px;
      height: 2px;
      background: rgba(255, 215, 0, 0.2);
      flex-shrink: 0;
    }

    .step-line.done {
      background: rgba(255, 215, 0, 0.5);
    }

    .step-name {
      font-size: 11px;
      color: rgba(255, 215, 0, 0.6);
      letter-spacing: 3px;
      margin-top: 8px;
    }

    .page-title {
      font-size: 24px;
      font-weight: 700;
      color: #FFD700;
      letter-spacing: 6px;
      text-shadow: 0 2px 20px rgba(255, 215, 0, 0.3);
      text-align: center;
      margin-bottom: 4px;
    }

    .page-subtitle {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.6);
      letter-spacing: 4px;
      text-align: center;
      margin-bottom: 20px;
    }

    .oath-panel {
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .oath-box {
      position: relative;
      padding: 28px 20px;
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 215, 0, 0.2);
      border-radius: 10px;
      backdrop-filter: blur(4px);
    }

    .oath-text {
      min-height: 12em;
      margin: 0;
      color: rgba(255, 245, 235, 0.92);
      font-size: 18px;
      font-weight: 600;
      line-height: 1.9;
      text-align: justify;
      letter-spacing: 2px;
      text-shadow: 0 1px 10px rgba(0, 0, 0, 0.3);
    }

    .oath-text::after {
      display: inline-block;
      width: 2px;
      height: 1em;
      margin-left: 3px;
      vertical-align: -0.1em;
      background: #FFD700;
      animation: caret 780ms steps(1) infinite;
      content: "";
    }

    .oath-text.is-done::after {
      opacity: 0;
      animation: none;
    }

    @keyframes caret {
      0%, 48% { opacity: 1; }
      49%, 100% { opacity: 0; }
    }

    .signature {
      margin: 16px 0 0;
      color: rgba(255, 215, 0, 0.5);
      font-size: 12px;
      letter-spacing: 2px;
      text-align: right;
    }

    .actions {
      display: flex;
      justify-content: center;
      margin-top: 24px;
    }

    .replay {
      min-width: 160px;
      padding: 12px 32px;
      color: #C41E3A;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 3px;
      background: linear-gradient(135deg, #FFD700, #FFC107, #FFD700);
      border: none;
      border-radius: 40px;
      box-shadow: 0 4px 20px rgba(255, 215, 0, 0.3);
      cursor: pointer;
      transition: transform 0.2s;
    }

    .replay:active {
      transform: scale(0.95);
    }

    .footer {
      width: 100%;
      padding-top: 20px;
      text-align: center;
    }

    .back-btn {
      display: inline-block;
      padding: 10px 36px;
      color: rgba(255, 255, 255, 0.7);
      font-size: 13px;
      letter-spacing: 3px;
      text-decoration: none;
      border: 1px solid rgba(255, 215, 0, 0.25);
      border-radius: 40px;
      backdrop-filter: blur(4px);
      background: rgba(0, 0, 0, 0.15);
      transition: all 0.3s;
    }

    .back-btn:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>
  <div class="page-wrapper">
    <div class="badge">★ 中山大学党校</div>

    <!-- 步骤进度条 -->
    <div class="step-bar">
      <div class="step-dots">
        <div class="step-dot done"></div>
        <div class="step-line done"></div>
        <div class="step-dot done"></div>
        <div class="step-line done"></div>
        <div class="step-dot done"></div>
        <div class="step-line"></div>
        <div class="step-dot active"></div>
      </div>
      <div class="step-name">入党心声</div>
    </div>

    <div class="page-title">我的入党心声</div>
    <div class="page-subtitle">— 入党发展对象培训班 31 小组 —</div>

    <div class="oath-panel">
      <div class="oath-box">
        <p class="oath-text" id="oathText" aria-live="polite"></p>
        <p class="signature">——中山大学珠海校区 2026 年第二期学生入党发展对象培训班 31 小组</p>
      </div>
      <div class="actions">
        <button class="replay" id="replayButton" type="button">重温入党誓词</button>
      </div>
    </div>

    <div class="footer">
      <a href="index.html" class="back-btn">返回首页</a>
    </div>
  </div>

  <script>
    const oath = "我志愿加入中国共产党，拥护党的纲领，遵守党的章程，履行党员义务，执行党的决定，严守党的纪律，保守党的秘密，对党忠诚，积极工作，为共产主义奋斗终身，随时准备为党和人民牺牲一切，永不叛党。";
    const oathText = document.querySelector("#oathText");
    const replayButton = document.querySelector("#replayButton");
    let timer = null;
    let index = 0;

    function stopTyping() {
      if (timer) {
        window.clearInterval(timer);
        timer = null;
      }
    }

    function playOath() {
      stopTyping();
      index = 0;
      oathText.textContent = "";
      oathText.classList.remove("is-done");
      timer = window.setInterval(() => {
        oathText.textContent += oath.charAt(index);
        index += 1;
        if (index >= oath.length) {
          stopTyping();
          oathText.classList.add("is-done");
        }
      }, 88);
    }

    replayButton.addEventListener("click", playOath);
    window.addEventListener("DOMContentLoaded", playOath);
  </script>
</body>
</html>
