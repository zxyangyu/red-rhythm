<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>初心·印记——走近身边的共产党员</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
        }

        .container {
            width: 100%;
            max-width: 375px;
            height: 100vh;
            margin: 0 auto;
            position: relative;
            overflow: hidden;
            background: linear-gradient(160deg, #8B0000 0%, #C41E3A 30%, #D32F2F 60%, #B71C1C 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 45px 24px 30px;
        }

        /* ========== 红旗飘扬 ========== */
        .flag {
            position: absolute;
            z-index: 1;
            pointer-events: none;
        }

        .flag-left {
            top: 10px;
            left: -2px;
            width: 70px;
            height: 42px;
            transform-origin: left center;
            animation: flagWaveLeft 2.4s ease-in-out infinite;
        }

        .flag-right {
            top: 10px;
            right: -2px;
            width: 70px;
            height: 42px;
            transform-origin: right center;
            animation: flagWaveRight 2.4s ease-in-out infinite;
        }

        .flag-body {
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #FF1744, #D50000);
            position: relative;
            border-radius: 0 2px 2px 0;
        }

        .flag-body::before {
            content: '★';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #FFD700;
            font-size: 18px;
            text-shadow: 0 0 6px rgba(255, 215, 0, 0.6);
        }

        .flag-pole {
            position: absolute;
            top: 0;
            width: 3px;
            height: 56px;
            background: linear-gradient(180deg, #C6A55B, #8B6914, #C6A55B);
            border-radius: 2px;
        }

        .flag-left .flag-pole {
            left: -3px;
        }

        .flag-right .flag-pole {
            right: -3px;
        }

        .flag-right .flag-body {
            border-radius: 2px 0 0 2px;
        }

        @keyframes flagWaveLeft {
            0%, 100% { transform: perspective(200px) rotateY(0deg) scaleX(1); }
            25% { transform: perspective(200px) rotateY(12deg) scaleX(0.95); }
            50% { transform: perspective(200px) rotateY(0deg) scaleX(1); }
            75% { transform: perspective(200px) rotateY(-8deg) scaleX(0.97); }
        }

        @keyframes flagWaveRight {
            0%, 100% { transform: perspective(200px) rotateY(0deg) scaleX(1); }
            25% { transform: perspective(200px) rotateY(-12deg) scaleX(0.95); }
            50% { transform: perspective(200px) rotateY(0deg) scaleX(1); }
            75% { transform: perspective(200px) rotateY(8deg) scaleX(0.97); }
        }

        /* ========== 金色波浪 ========== */
        .wave-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 50px;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
        }

        .wave-container svg {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 200%;
            height: 100%;
        }

        .wave-1 {
            animation: waveMove 4s linear infinite;
            opacity: 0.35;
        }

        .wave-2 {
            animation: waveMove 3s linear infinite reverse;
            opacity: 0.2;
            bottom: -4px;
        }

        @keyframes waveMove {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        /* ========== 飘落红星背景 ========== */
        .stars-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 1;
        }

        .star {
            position: absolute;
            top: -30px;
            color: rgba(255, 215, 0, 0.6);
            font-size: 18px;
            animation: starFall linear infinite;
            opacity: 0;
        }

        @keyframes starFall {
            0% {
                transform: translateY(0) rotate(0deg) scale(0.5);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(calc(100vh + 50px)) rotate(720deg) scale(1.2);
                opacity: 0;
            }
        }

        /* ========== 红色光晕装饰 ========== */
        .glow {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.3;
            pointer-events: none;
            z-index: 1;
        }

        .glow-1 {
            width: 250px;
            height: 250px;
            background: #FFD700;
            top: -60px;
            right: -80px;
        }

        .glow-2 {
            width: 200px;
            height: 200px;
            background: #FF8F00;
            bottom: 20%;
            left: -60px;
        }

        .glow-3 {
            width: 180px;
            height: 180px;
            background: #FF5722;
            bottom: -40px;
            right: -40px;
        }

        /* ========== 顶部 ========== */
        .header {
            position: relative;
            z-index: 2;
            text-align: center;
            animation: fadeInDown 1s ease forwards;
        }

        .header .badge {
            display: inline-block;
            border: 1.5px solid rgba(255, 215, 0, 0.7);
            border-radius: 30px;
            padding: 6px 22px;
            font-size: 14px;
            color: #FFD700;
            letter-spacing: 3px;
            backdrop-filter: blur(4px);
            background: rgba(255, 215, 0, 0.08);
        }

        .header .subtitle {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.8);
            margin-top: 12px;
            letter-spacing: 4px;
        }

        @keyframes fadeInDown {
            0% {
                opacity: 0;
                transform: translateY(-20px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ========== 中间主标题 ========== */
        .main-title-wrapper {
            position: relative;
            z-index: 2;
            text-align: center;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        .main-title {
            color: #FFD700;
            font-size: 30px;
            font-weight: 700;
            letter-spacing: 6px;
            line-height: 1.5;
            text-shadow: 0 2px 20px rgba(255, 215, 0, 0.4), 0 0 60px rgba(255, 215, 0, 0.15);
            opacity: 0;
            transform: translateY(40px);
            animation: titleFadeInUp 1.2s ease 0.6s forwards;
        }

        .main-title .divider {
            display: block;
            width: 50px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #FFD700, transparent);
            margin: 14px auto;
        }

        .main-title .sub-line {
            display: block;
            font-size: 18px;
            font-weight: 500;
            letter-spacing: 5px;
            color: #FFFFFF;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
        }

        @keyframes titleFadeInUp {
            0% {
                opacity: 0;
                transform: translateY(40px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ========== 装饰线 ========== */
        .deco-line {
            position: relative;
            z-index: 2;
            width: 80%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 215, 0, 0.5), transparent);
            margin: 0 auto;
            opacity: 0;
            animation: fadeIn 1s ease 1.4s forwards;
        }

        @keyframes fadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        /* ========== 团队照片自动滚动 ========== */
        .team-section {
            position: relative;
            z-index: 2;
            width: 100%;
            margin-top: 16px;
            opacity: 0;
            animation: fadeIn 1s ease 2.6s forwards;
        }

        .team-label {
            text-align: center;
            font-size: 11px;
            color: rgba(255, 215, 0, 0.75);
            letter-spacing: 2px;
            margin-bottom: 10px;
            line-height: 1.6;
            padding: 0 10px;
        }

        /* ---- 照片滚动 ---- */
        .photo-strip-wrapper {
            position: relative;
            width: 100%;
            height: 56px;
            overflow: hidden;
        }

        .photo-strip-wrapper::before,
        .photo-strip-wrapper::after {
            content: '';
            position: absolute;
            top: 0;
            width: 30px;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        .photo-strip-wrapper::before {
            left: 0;
            background: linear-gradient(90deg, #C41E3A 0%, transparent 100%);
        }

        .photo-strip-wrapper::after {
            right: 0;
            background: linear-gradient(270deg, #C41E3A 0%, transparent 100%);
        }

        .photo-strip {
            display: flex;
            gap: 14px;
            width: max-content;
            animation: scrollLeft 20s linear infinite;
            padding: 0 8px;
            height: 100%;
            align-items: center;
        }

        .photo-strip:hover {
            animation-play-state: paused;
        }

        .photo-card {
            flex-shrink: 0;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid rgba(255, 215, 0, 0.5);
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.25);
            transition: transform 0.3s ease, border-color 0.3s ease;
            cursor: pointer;
        }

        .photo-card:hover {
            transform: scale(1.12);
            border-color: #FFD700;
        }

        .photo-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* ---- 姓名滚动 ---- */
        .name-strip-wrapper {
            position: relative;
            width: 100%;
            height: 22px;
            overflow: hidden;
            margin-top: 6px;
        }

        .name-strip-wrapper::before,
        .name-strip-wrapper::after {
            content: '';
            position: absolute;
            top: 0;
            width: 30px;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        .name-strip-wrapper::before {
            left: 0;
            background: linear-gradient(90deg, #C41E3A 0%, transparent 100%);
        }

        .name-strip-wrapper::after {
            right: 0;
            background: linear-gradient(270deg, #C41E3A 0%, transparent 100%);
        }

        .name-strip {
            display: flex;
            gap: 38px;
            width: max-content;
            animation: scrollLeft 16s linear infinite;
            padding: 0 12px;
            height: 100%;
            align-items: center;
        }

        .name-item {
            flex-shrink: 0;
            font-size: 11px;
            color: rgba(255, 215, 0, 0.8);
            letter-spacing: 2px;
            white-space: nowrap;
        }

        @keyframes scrollLeft {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        /* ========== 底部 ========== */
        .footer {
            position: relative;
            z-index: 2;
            text-align: center;
            width: 100%;
            padding-top: 10px;
        }

        .btn-wrapper {
            position: relative;
            display: inline-block;
        }

        /* 按钮脉冲光晕 */
        .btn-wrapper::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100%;
            height: 100%;
            transform: translate(-50%, -50%) scale(1);
            border-radius: 40px;
            background: rgba(255, 215, 0, 0.25);
            animation: pulseRing 2s ease-in-out 2.6s infinite;
            pointer-events: none;
        }

        @keyframes pulseRing {
            0%, 100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 0.6;
            }
            50% {
                transform: translate(-50%, -50%) scale(1.15);
                opacity: 0;
            }
        }

        .explore-btn {
            display: inline-block;
            padding: 14px 48px;
            font-size: 17px;
            font-weight: 600;
            color: #C41E3A;
            background: linear-gradient(135deg, #FFD700, #FFC107, #FFD700);
            border: none;
            border-radius: 40px;
            letter-spacing: 4px;
            cursor: pointer;
            box-shadow: 0 4px 25px rgba(255, 215, 0, 0.4);
            transition: all 0.3s ease;
            opacity: 0;
            transform: translateY(20px);
            animation: btnFadeInUp 0.8s ease 1.8s forwards;
            position: relative;
            overflow: hidden;
            text-decoration: none;
        }

        .explore-btn::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transform: rotate(45deg) translateX(-100%);
            transition: 0.6s;
        }

        .explore-btn:hover::after {
            transform: rotate(45deg) translateX(100%);
        }

        .explore-btn:active {
            transform: scale(0.95);
        }

        @keyframes btnFadeInUp {
            0% {
                opacity: 0;
                transform: translateY(20px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .footer .hint {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 14px;
            letter-spacing: 2px;
            opacity: 0;
            animation: fadeIn 1s ease 2.4s forwards;
        }

        /* ========== 点击星光扩散 ========== */
        .sparkle {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            color: #FFD700;
            font-size: 16px;
            animation: sparkleFly 1s ease-out forwards;
        }

        @keyframes sparkleFly {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(1) rotate(0deg);
            }
            100% {
                opacity: 0;
                transform: translate(var(--tx), var(--ty)) scale(0) rotate(720deg);
            }
        }
    </style>
</head>
<body>
    <div class="container" id="container">
        <!-- 光晕装饰 -->
        <div class="glow glow-1"></div>
        <div class="glow glow-2"></div>
        <div class="glow glow-3"></div>

        <!-- 红旗 -->
        <div class="flag flag-left">
            <div class="flag-pole"></div>
            <div class="flag-body"></div>
        </div>
        <div class="flag flag-right">
            <div class="flag-pole"></div>
            <div class="flag-body"></div>
        </div>

        <!-- 金色波浪 -->
        <div class="wave-container">
            <svg class="wave-1" viewBox="0 0 1440 60" preserveAspectRatio="none">
                <path d="M0,30 C240,0 480,60 720,30 C960,0 1200,60 1440,30 L1440,60 L0,60 Z" fill="#FFD700"/>
            </svg>
            <svg class="wave-2" viewBox="0 0 1440 60" preserveAspectRatio="none">
                <path d="M0,30 C240,60 480,0 720,30 C960,60 1200,0 1440,30 L1440,60 L0,60 Z" fill="#FFC107"/>
            </svg>
        </div>

        <!-- 飘落红星 -->
        <div class="stars-bg" id="starsBg"></div>

        <!-- 顶部 -->
        <div class="header">
            <div class="badge">★ 中山大学党校</div>
            <div class="subtitle">— 党员教育 · 初心课堂 —</div>
        </div>

        <!-- 主标题 -->
        <div class="main-title-wrapper">
            <div class="main-title">
                初心 · 印记
                <span class="divider"></span>
                <span class="sub-line">走近身边的共产党员</span>
            </div>
        </div>

        <div class="deco-line"></div>

        <!-- 底部 -->
        <div class="footer">
            <div class="btn-wrapper">
                <a class="explore-btn" href="page2.html">开始探索</a>
            </div>
            <div class="hint">轻触上方按钮，开启初心之旅</div>

            <!-- 团队照片 -->
            <div class="team-section">
                <div class="team-label">创作团队：中山大学珠海校区2026 年第 2 期<br>学生入党发展对象培训班 31 小组</div>
                <div class="photo-strip-wrapper">
                    <div class="photo-strip" id="photoStrip"></div>
                </div>
                <div class="name-strip-wrapper">
                    <div class="name-strip" id="nameStrip"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            // ========== 飘落红星 ==========
            const starsBg = document.getElementById('starsBg');
            const starSymbols = ['★', '✧', '✦'];
            const starCount = 35;

            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('span');
                star.className = 'star';
                star.textContent = starSymbols[i % starSymbols.length];
                star.style.left = Math.random() * 100 + '%';
                star.style.fontSize = (Math.random() * 14 + 10) + 'px';
                star.style.animationDuration = (Math.random() * 8 + 6) + 's';
                star.style.animationDelay = (Math.random() * 10) + 's';
                star.style.opacity = Math.random() * 0.5 + 0.2;
                starsBg.appendChild(star);
            }

            // ========== 团队照片自动滚动 ==========
            const photoStrip = document.getElementById('photoStrip');
            const nameStrip = document.getElementById('nameStrip');

            // 在此添加更多照片：在数组中新增一行即可
            // 格式：{ name: '成员名', file: '文件名.jpg' }
            const teamPhotos = [
                { name: '成员1', file: '6abd4adb93b6eee37e4f879c4f8495e2.jpg' },
                { name: '成员2', file: '5325475330169457a098fe7df180f1d4.jpg' },
                { name: '成员3', file: '6abd4adb93b6eee37e4f879c4f8495e2.jpg' },
                { name: '成员4', file: '5325475330169457a098fe7df180f1d4.jpg' },
                { name: '成员5', file: '6abd4adb93b6eee37e4f879c4f8495e2.jpg' },
                { name: '成员6', file: '5325475330169457a098fe7df180f1d4.jpg' },
                { name: '成员7', file: '6abd4adb93b6eee37e4f879c4f8495e2.jpg' },
                { name: '成员8', file: '5325475330169457a098fe7df180f1d4.jpg' },
            ];

            function createPhotoCard(photo) {
                const card = document.createElement('div');
                card.className = 'photo-card';
                const img = document.createElement('img');
                img.src = 'image/' + photo.file;
                img.alt = photo.name;
                img.loading = 'lazy';
                card.appendChild(img);
                return card;
            }

            teamPhotos.forEach(function(p) {
                photoStrip.appendChild(createPhotoCard(p));
            });
            teamPhotos.forEach(function(p) {
                photoStrip.appendChild(createPhotoCard(p));
            });

            function createNameItem(photo) {
                const el = document.createElement('span');
                el.className = 'name-item';
                el.textContent = photo.name;
                return el;
            }

            teamPhotos.forEach(function(p) {
                nameStrip.appendChild(createNameItem(p));
            });
            teamPhotos.forEach(function(p) {
                nameStrip.appendChild(createNameItem(p));
            });

            // ========== 点击星光扩散特效 ==========
            const sparkleSymbols = ['★', '✦', '✧', '∙', '·'];
            const body = document.body;

            body.addEventListener('click', function(e) {
                const count = 12;
                for (let i = 0; i < count; i++) {
                    const el = document.createElement('span');
                    el.className = 'sparkle';
                    el.textContent = sparkleSymbols[i % sparkleSymbols.length];
                    el.style.left = e.clientX + 'px';
                    el.style.top = e.clientY + 'px';
                    el.style.fontSize = (Math.random() * 10 + 8) + 'px';

                    const angle = (Math.PI * 2 / count) * i + (Math.random() - 0.5) * 0.4;
                    const dist = Math.random() * 80 + 40;
                    el.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
                    el.style.setProperty('--ty', Math.sin(angle) * dist - 20 + 'px');

                    const colors = ['#FFD700', '#FFC107', '#FFE082', '#FFFFFF', '#FF6F00'];
                    el.style.color = colors[Math.floor(Math.random() * colors.length)];

                    body.appendChild(el);
                    setTimeout(function() { el.remove(); }, 1000);
                }
            });
        })();
    </script>
</body>
</html>
