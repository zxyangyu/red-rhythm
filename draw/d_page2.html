<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>初心·印记</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
        }

        .container {
            width: 100%;
            max-width: 375px;
            height: 100vh;
            margin: 0 auto;
            background: linear-gradient(160deg, #8B0000 0%, #C41E3A 50%, #B71C1C 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 24px;
            position: relative;
        }

        .glow {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.25;
            pointer-events: none;
        }

        .glow-1 {
            width: 200px;
            height: 200px;
            background: #FFD700;
            top: -60px;
            right: -60px;
        }

        .glow-2 {
            width: 160px;
            height: 160px;
            background: #FF8F00;
            bottom: 10%;
            left: -50px;
        }

        .content {
            position: relative;
            z-index: 2;
            text-align: center;
            opacity: 0;
            animation: fadeInUp 0.8s ease 0.3s forwards;
        }

        .content h1 {
            font-size: 26px;
            color: #FFD700;
            letter-spacing: 4px;
            margin-bottom: 16px;
            text-shadow: 0 2px 20px rgba(255, 215, 0, 0.3);
        }

        .content p {
            font-size: 15px;
            color: rgba(255, 255, 255, 0.85);
            line-height: 1.8;
            letter-spacing: 2px;
            max-width: 300px;
            margin: 0 auto;
        }

        .back-btn {
            position: relative;
            z-index: 2;
            margin-top: 50px;
            display: inline-block;
            padding: 12px 36px;
            font-size: 15px;
            font-weight: 600;
            color: #C41E3A;
            background: linear-gradient(135deg, #FFD700, #FFC107);
            border: none;
            border-radius: 40px;
            letter-spacing: 3px;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 4px 20px rgba(255, 215, 0, 0.3);
            transition: all 0.3s ease;
            opacity: 0;
            animation: fadeInUp 0.8s ease 0.8s forwards;
        }

        .back-btn:active {
            transform: scale(0.95);
        }

        @keyframes fadeInUp {
            0% {
                opacity: 0;
                transform: translateY(30px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="glow glow-1"></div>
        <div class="glow glow-2"></div>

        <div class="content">
            <h1>★ 欢迎进入</h1>
            <p>
                在中山大学，有这样一群人——<br>
                他们默默耕耘，无私奉献；<br>
                他们不忘初心，牢记使命。<br><br>
                他们，就是身边的共产党员。
            </p>
        </div>

        <a class="back-btn" href="index.html">返回首页</a>
    </div>
</body>
</html>
